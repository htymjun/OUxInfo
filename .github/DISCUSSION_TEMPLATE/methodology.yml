title: "Methodology Discussion"
body:
  - type: textarea
    id: topic
    attributes:
      label: Topic
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide mathematical, numerical, or scientific context.

  - type: textarea
