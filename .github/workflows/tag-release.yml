name: Tag and release on version bump

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(python -c "
          import re, pathlib
          text = pathlib.Path('ouxinfo/_version.py').read_text()
          print(re.search(r'__version__\s*=\s*[\"\\x27]([^\"\\x27]+)', text).group(1))
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check CITATION.cff version matches _version.py
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          version = pathlib.Path("ouxinfo/_version.py").read_text(encoding="utf-8")
          citation = pathlib.Path("CITATION.cff").read_text(encoding="utf-8")
          version_match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', version)
          citation_match = re.search(r'(?m)^version:\s*(.+)$', citation)

          if version_match is None:
              print("Could not find __version__ in ouxinfo/_version.py", file=sys.stderr)
              raise SystemExit(1)
          if citation_match is None:
              print("Could not find version field in CITATION.cff", file=sys.stderr)
              raise SystemExit(1)

          version_value = version_match.group(1).strip()
          citation_value = citation_match.group(1).strip()
          if citation_value != version_value:
              print(
                  f"CITATION.cff version {citation_value!r} does not match "
                  f"ouxinfo/_version.py version {version_value!r}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

      - name: Check if tag exists
        id: tag_check
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and draft release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --draft
