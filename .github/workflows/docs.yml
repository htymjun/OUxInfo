name: Docs

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc g++

      - name: Build package
        run: |
          pip install setuptools pybind11
          pip install -e .

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material mkdocstrings[python] pymdown-extensions

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
