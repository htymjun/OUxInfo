site_name: OUxInfo
site_description: A Python package powered by a C++ backend for Shannon entropy estimator for causal inference.
site_url: https://htymjun.github.io/OUxInfo/
repo_url: https://github.com/htymjun/OUxInfo
repo_name: htymjun/OUxInfo

theme:
  name: material
  logo: img/OUxInfo.png
  favicon: img/OUxInfo.png
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.highlight

plugins:
  - search:
      lang: en
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_signature_annotations: false
            show_root_heading: true
            heading_level: 3
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - css/extra.css

exclude_docs: |
  plans/

nav:
  - Home: index.md
  - Installation: install.md
  - API Reference: api.md
  - Validation: validation.md
